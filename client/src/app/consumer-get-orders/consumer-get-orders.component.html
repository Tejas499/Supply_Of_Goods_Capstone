<div class="container mt-4">
  <h3 class="mb-4">My Orders</h3>

  <div class="card mb-4">
    <div class="card-header">Provide Feedback</div>
    <div class="card-body">
      <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Order ID</label>
            <input type="number" class="form-control" formControlName="orderId" placeholder="Order ID">
          </div>
          <div class="col-md-4">
            <label class="form-label">Feedback</label>
            <input type="text" class="form-control" formControlName="content" placeholder="Your feedback">
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-outline-secondary">Submit Feedback</button>
          </div>
        </div>
        <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Order Information</div>
    <div class="card-body p-0">
      <table class="table table-bordered mb-0">
        <thead>
          <tr>
            <th>Sr#</th>
            <th>Order ID</th>
            <th>Quantity</th>
            <th>Status</th>
            <th>Product</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let o of orders; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ o.id }}</td>
            <td>{{ o.quantity }}</td>
            <td>{{ o.status }}</td>
            <td>
              <div>Name: {{ o.product?.name }}</div>
              <div>Price: {{ o.product?.price }}</div>
            </td>
          </tr>
          <tr *ngIf="orders.length === 0">
            <td colspan="5" class="text-center text-muted">No orders found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
