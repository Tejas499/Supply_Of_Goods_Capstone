<div class="container mt-4">
  <h3 class="mb-4">Place Order</h3>

  <div class="card mb-4">
    <div class="card-header">Place Order</div>
    <div class="card-body">
      <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Quantity</label>
            <input type="number" class="form-control" formControlName="quantity" placeholder="QTY">
            <div *ngIf="itemForm.get('quantity')?.invalid && itemForm.get('quantity')?.touched" class="text-danger small">Required.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Status</label>
            <input type="text" class="form-control" formControlName="status" placeholder="Select Status">
            <div *ngIf="itemForm.get('status')?.invalid && itemForm.get('status')?.touched" class="text-danger small">Required.</div>
          </div>
        </div>
        <div *ngIf="successMsg" class="alert alert-success">{{ successMsg }}</div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Order Information</div>
    <div class="card-body p-0">
      <table class="table table-bordered mb-0">
        <thead>
          <tr>
            <th>Sr#</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Stock Quantity</th>
            <th>Description</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of products; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.price }}</td>
            <td>{{ p.stockQuantity }}</td>
            <td>{{ p.description }}</td>
            <td>
              <button class="btn btn-warning btn-sm" (click)="selectProduct(p)">Add For Order</button>
            </td>
          </tr>
          <tr *ngIf="products.length === 0">
            <td colspan="6" class="text-center text-muted">No products available.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
