<div class="container mt-4">
  <h3 class="mb-4">Manage Products</h3>

  <div class="card mb-4">
    <div class="card-header">Add Products</div>
    <div class="card-body">
      <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Product Name</label>
            <input type="text" class="form-control" formControlName="name" placeholder="Product Name">
            <div *ngIf="itemForm.get('name')?.invalid && itemForm.get('name')?.touched" class="text-danger small">Required.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Stock Quantity</label>
            <input type="number" class="form-control" formControlName="stockQuantity" placeholder="Stock Quantity">
            <div *ngIf="itemForm.get('stockQuantity')?.invalid && itemForm.get('stockQuantity')?.touched" class="text-danger small">Required.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Price</label>
            <input type="number" class="form-control" formControlName="price" placeholder="Price">
            <div *ngIf="itemForm.get('price')?.invalid && itemForm.get('price')?.touched" class="text-danger small">Required.</div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea class="form-control" formControlName="description" rows="3" placeholder="Description"></textarea>
          <div *ngIf="itemForm.get('description')?.invalid && itemForm.get('description')?.touched" class="text-danger small">Required.</div>
        </div>
        <button type="submit" class="btn btn-outline-secondary" [disabled]="itemForm.invalid">Submit</button>
        <div *ngIf="successMsg" class="alert alert-success mt-3">{{ successMsg }}</div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-header">Product Information</div>
    <div class="card-body p-0">
      <table class="table table-bordered mb-0">
        <thead>
          <tr>
            <th>Sr#</th>
            <th>Product Name</th>
            <th>Price</th>
            <th>Stock Quantity</th>
            <th>Description</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let p of products; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.price }}</td>
            <td>{{ p.stockQuantity }}</td>
            <td>{{ p.description }}</td>
            <td>
              <button class="btn btn-warning btn-sm" (click)="editProduct(p)">Edit</button>
            </td>
          </tr>
          <tr *ngIf="products.length === 0">
            <td colspan="6" class="text-center text-muted">No products found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
