<div class="auth-wrapper">
  <div class="auth-card animate">
    <div class="auth-header">
      <div class="logo" routerLink="/">FLOW<span>.</span></div>
      <h2>Welcome Back</h2>
      <p>Securely manage your goods and distribution.</p>
    </div>

    <div *ngIf="errorMsg" class="server-error">{{ errorMsg }}</div>

    <form [formGroup]="itemForm" (ngSubmit)="onSubmit()" class="auth-form">

      <!-- Username -->
      <div class="form-group">
        <label>Username</label>
        <div class="input-container">
          <input type="text" formControlName="username" placeholder="Enter your username">
        </div>
        <div *ngIf="itemForm.get('username')?.invalid && itemForm.get('username')?.touched" class="error-msg">
          Username is required.
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <div class="input-container">
          <input type="password" formControlName="password" placeholder="••••••••">
        </div>
        <div *ngIf="itemForm.get('password')?.invalid && itemForm.get('password')?.touched" class="error-msg">
          Password is required.
        </div>
      </div>

      <!-- Captcha Section -->
      <div class="form-group captcha-section">
        <label>Security Verification</label>
        <div class="captcha-wrapper">
          <div class="captcha-display">
            <span>{{ num1 }} {{ operator }} {{ num2 }}</span>
            <button type="button" class="refresh-btn" (click)="generateCaptcha()" title="Refresh Captcha">↻</button>
          </div>
          <input type="number" formControlName="captcha" (input)="validateCaptcha()" placeholder="Answer">
        </div>
        <div *ngIf="itemForm.get('captcha')?.value && !isCaptchaValid" class="error-msg">
          Incorrect security answer.
        </div>
      </div>

      <!-- Login Button -->
      <button type="submit" class="btn-primary" [disabled]="itemForm.invalid || !isCaptchaValid">
        <span>Login to Flow</span>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account?
      <a [routerLink]="['/registration']">Register Now</a>
    </div>
  </div>
</div>
