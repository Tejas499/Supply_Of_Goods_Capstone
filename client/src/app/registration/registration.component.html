<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow p-4" style="width: 100%; max-width: 500px;">
    <h2 class="text-center fw-bold mb-4">Create an Account</h2>

    <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" formControlName="username" placeholder="Username">
        <div *ngIf="itemForm.get('username')?.invalid && itemForm.get('username')?.touched" class="text-danger small">
          Username is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" placeholder="email@example.com">
        <div *ngIf="itemForm.get('email')?.invalid && itemForm.get('email')?.touched" class="text-danger small">
          Valid email is required.
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password" placeholder="••••••••">
        <div *ngIf="itemForm.get('password')?.invalid && itemForm.get('password')?.touched" class="text-danger small">
          Password is required.
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label">Role</label>
        <select class="form-select" formControlName="role">
          <option value="">-- Select Role --</option>
          <option value="MANUFACTURER">Manufacturer</option>
          <option value="WHOLESALER">Wholesaler</option>
          <option value="CONSUMER">Consumer</option>
        </select>
        <div *ngIf="itemForm.get('role')?.invalid && itemForm.get('role')?.touched" class="text-danger small">
          Role is required.
        </div>
      </div>

      <button type="submit" class="btn btn-dark w-100 mb-3" [disabled]="itemForm.invalid">Register</button>
    </form>

    <p class="text-center mb-0">Already have an account?
      <a [routerLink]="['/login']" class="fw-bold text-primary">Login</a>
    </p>
  </div>
</div>
